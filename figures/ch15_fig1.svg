="#8fa4b8" stroke-width="1.5" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="225.00" y1="168.00" x2="229.12" y2="174.86" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="225.00" y1="168.00" x2="220.88" y2="174.86" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="435.00" y="218.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal" font-style="italic">if a criterion fails: retrain the probes or redefine the dimensions</text><line x1="22.00" y1="248.00" x2="698.00" y2="248.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="22.00" y="272.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="start" font-weight="600">the five validation criteria of step 5</text><text x="22.00" y="294.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">1  dimension independence: no pair of scores correlated above 0.7</text><text x="22.00" y="312.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">2  gauge invariance: scores unchanged under legally irrelevant changes</text><text x="22.00" y="330.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">3  topological consistency: no spurious Wilson loops on known-consistent chains</text><text x="22.00" y="348.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">4  retrieval accuracy: retrieved precedents match e