<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="The five open problems depend on one another"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">The five open problems depend on one another</text><rect x="36.00" y="70.00" width="196.00" height="56.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="134.00" y="95.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">1  Metric calibration</text><text x="134.00" y="109.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">how to calibrate, how sensitive</text><rect x="262.00" y="70.00" width="196.00" height="56.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="360.00" y="95.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">2  Cross-jurisdictional invariance</text><text x="360.00" y="109.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">are the dimensions universal</text><rect x="488.00" y="70.00" width="196.00" height="56.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="586.00" y="95.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">5  International coherence</text><text x="586.00" y="109.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">many systems, one framework</text><rect x="36.00" y="270.00" width="196.00" height="56.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="134.00" y="295.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">4  Dynamic complexes</text><text x="134.00" y="309.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">a complex that changes in time</text><rect x="488.00" y="270.00" width="196.00" height="56.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="586.00" y="295.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">3  Fundamental group</text><text x="586.00" y="309.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">is it computable</text><line x1="234.00" y1="98.00" x2="259.00" y2="98.00" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="259.00" y1="98.00" x2="252.14" y2="102.12" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="259.00" y1="98.00" x2="252.14" y2="93.88" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="460.00" y1="98.00" x2="485.00" y2="98.00" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="485.00" y1="98.00" x2="478.14" y2="102.12" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="485.00" y1="98.00" x2="478.14" y2="93.88" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><text x="249.00" y="60.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="middle" font-weight="normal">affects</text><text x="475.00" y="60.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="middle" font-weight="normal">feeds into</text><text x="360.00" y="148.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">the calibration must handle traditions</text><text x="360.00" y="162.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">with different dimensions</text><text x="586.00" y="148.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">comparing positions across systems</text><text x="586.00" y="162.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">needs consistent dimensions</text><line x1="134.00" y1="268.00" x2="134.00" y2="130.00" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="134.00" y1="130.00" x2="138.12" y2="136.86" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="134.00" y1="130.00" x2="129.88" y2="136.86" stroke="#66c2a5" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><text x="146.00" y="196.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">is required for:</text><text x="146.00" y="211.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">the metric is recalibrated</text><text x="146.00" y="226.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">as the complex changes</text><line x1="240.00" y1="298.00" x2="480.00" y2="298.00" stroke="#fc8d62" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="484.00" y1="298.00" x2="477.14" y2="302.12" stroke="#fc8d62" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="484.00" y1="298.00" x2="477.14" y2="293.88" stroke="#fc8d62" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="236.00" y1="298.00" x2="242.86" y2="293.88" stroke="#fc8d62" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="236.00" y1="298.00" x2="242.86" y2="302.12" stroke="#fc8d62" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><text x="360.00" y="288.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="middle" font-weight="normal">intersects</text><text x="360.00" y="318.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">the fundamental group of a changing</text><text x="360.00" y="332.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">complex is harder than a static one's</text><rect x="36.00" y="367.00" width="12" height="12" rx="3" fill="#66c2a5"/><text x="54.00" y="377.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">one problem bears on the next</text><rect x="284.80" y="367.00" width="12" height="12" rx="3" fill="#fc8d62"/><text x="302.80" y=