<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="From case text to a calibrated complex in five steps"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">From case text to a calibrated complex in five steps</text><text x="22.00" y="76.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">opinions, statutes, regulations</text><rect x="22.00" y="96.00" width="126.00" height="70.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="85.00" y="121.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">1  Embedding</text><text x="85.00" y="135.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">document to a</text><text x="85.00" y="149.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">vector e in ℝᵈ</text><rect x="162.00" y="96.00" width="126.00" height="70.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="225.00" y="121.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">2  Dimension scoring</text><text x="225.00" y="135.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">eight linear probes:</text><text x="225.00" y="149.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">v in [0, 1]⁸</text><line x1="149.00" y1="131.00" x2="160.00" y2="131.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="160.00" y1="131.00" x2="153.14" y2="135.12" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="160.00" y1="131.00" x2="153.14" y2="126.88" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><rect x="302.00" y="96.00" width="126.00" height="70.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="365.00" y="121.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">3  Covariance</text><text x="365.00" y="135.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">8 × 8 matrix Σ,</text><text x="365.00" y="149.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">with shrinkage</text><line x1="289.00" y1="131.00" x2="300.00" y2="131.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="300.00" y1="131.00" x2="293.14" y2="135.12" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="300.00" y1="131.00" x2="293.14" y2="126.88" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><rect x="442.00" y="96.00" width="126.00" height="70.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><text x="505.00" y="121.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="600">4  Edge weights</text><text x="505.00" y="135.00" fon